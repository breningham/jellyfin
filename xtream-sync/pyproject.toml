[project]
name = "xtream-sync"
version = "0.1.0"
description = "Sync an Xtream IPTV provider's VOD and series into Jellyfin STRM libraries"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xtream-sync = "xtream_sync.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xtream_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
